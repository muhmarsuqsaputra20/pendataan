<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="tombol" href="index.html">← Kembali</a>
  <h1>Kalkulator Sederhana</h1>

  <div class="kartu">
    <input type="number" id="angka1" placeholder="Angka pertama">

    <select id="operator">
      <option value="+">Tambah (+)</option>
      <option value="-">Kurang (−)</option>
      <option value="*">Kali (×)</option>
      <option value="/">Bagi (÷)</option>
    </select>

    <input type="number" id="angka2" placeholder="Angka kedua">
    <button id="tombol-hitung">Hitung</button>
  </div>

  <h2 id="hasil">Hasil: -</h2>

  <script src="kalkulator.js"></script>
</body>
</html>
